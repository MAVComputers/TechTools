name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Catalog and engine checks (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\Test-Core.ps1

      - name: Catalog and engine checks (PowerShell 7)
        shell: pwsh
        run: ./tests/Test-Core.ps1

      - name: Window smoke test (builds every page without showing it)
        shell: powershell
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\app\TechTools.ps1 -SmokeTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
