name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Catalog and engine checks (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\Test-Core.ps1

      - name: Catalog and engine checks (PowerShell 7)
        shell: pwsh
        run: ./tests/Test-Core.ps1

      - name: Window smoke test (builds every page without showing it)
        shell: powershell
        run: |
          $out = powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\app\TechTools.ps1 -SmokeTest 2>&1 | ForEach-Object { [string]$_ }
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          # Failures also become annotations, so they can be read without the full log.
          $out | Where-Object { $_ -match 'FAIL|Exception|error' } | Select-Object -First 20 | ForEach-Object { Write-Host ('::error::' + $_) }
          if ($code -ne 0) { exit $code }
